name: Validate research assets
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('schemas/event.schema.json').read_text())
          for line in Path('examples/canary-callback.jsonl').read_text().splitlines():
              json.loads(line)
          print('JSON assets are syntactically valid')
          PY
